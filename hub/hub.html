<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Hub</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#121720; --panel2:#171d28; --line:#232c3b;
    --txt:#e6ecf5; --dim:#8b97ab; --accent:#4fd1c5; --accent2:#7aa2ff;
    --ok:#3ddc97; --warn:#ffb454; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(11,14,19,.93);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 20px}
  .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .stats{color:var(--dim);font-size:12.5px}
  .stats b{color:var(--txt)}
  .tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line)}
  .tab{padding:7px 14px;font-size:13px;color:var(--dim);cursor:pointer;user-select:none;
       border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  input[type=search],select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
       border-radius:7px;padding:7px 10px;font:inherit;font-size:13px;outline:none}
  input[type=search]{flex:1;min-width:220px}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:99px;
        padding:6px 13px;font-size:12.5px;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#06221f;font-weight:600}
  .hide{display:none !important}
  main{padding:18px 20px 70px;max-width:1500px;margin:0 auto}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;
        display:flex;flex-direction:column;gap:8px}
  .card.has{border-color:#26493f;background:linear-gradient(180deg,#0f1c19,var(--panel))}
  .nm{font-weight:650;font-size:14.5px;word-break:break-word}
  .nm .dot{color:var(--ok);margin-right:6px}
  .meta{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);
       color:var(--dim);border:1px solid var(--line)}
  .tag.mk{color:var(--accent2);border-color:#2b3a5c}
  .tag.off{color:var(--warn)}
  .tag.star{color:var(--warn);border-color:#4a3a1e}
  .desc{color:var(--dim);font-size:12.8px;flex:1}
  .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  button,a.btn{font:inherit;font-size:12.5px;border-radius:7px;padding:6px 12px;cursor:pointer;
       border:1px solid var(--line);background:var(--panel2);color:var(--txt);text-decoration:none}
  button:hover,a.btn:hover{border-color:var(--accent)}
  button.go{background:var(--accent);border-color:var(--accent);color:#06221f;font-weight:600}
  button.go:disabled{opacity:.5;cursor:default}
  button.ghost{color:var(--dim);padding:6px 9px}
  .note{font-size:11.5px;color:var(--dim)}
  .note.ok{color:var(--ok)} .note.err{color:var(--err)} .note.warn{color:var(--warn)}
  .empty{color:var(--dim);padding:40px;text-align:center}
  #log{position:fixed;right:16px;bottom:16px;max-width:480px;max-height:45vh;overflow:auto;
       background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
       font-size:12.5px;white-space:pre-wrap;display:none;box-shadow:0 12px 40px #0009;z-index:9}
  #log b{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Plugin Hub</h1>
    <div class="stats" id="stats">laden...</div>
  </div>
  <div class="tabs">
    <span class="tab on" data-mode="local">Mijn catalogus</span>
    <span class="tab" data-mode="gh">Zoek op GitHub</span>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Zoek op naam, omschrijving of categorie...">
    <select id="mk" class="localonly"></select>
    <select id="cat" class="localonly"></select>
    <span class="chip on localonly" data-f="all">Alles</span>
    <span class="chip localonly" data-f="has">Geinstalleerd</span>
    <span class="chip localonly" data-f="not">Nog niet</span>
    <button class="go ghonly hide" id="ghgo">Zoeken op GitHub</button>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Niets gevonden.</div>
</main>
<div id="log"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let DATA = [], GH = [], filter = "all", mode = "local";
const el = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const slug = k => k.replace(/[^a-zA-Z0-9]/g, "_");

function log(html){
  const d = el("log");
  d.innerHTML = html;
  d.style.display = "block";
  clearTimeout(d._t);
  d._t = setTimeout(() => { d.style.display = "none"; }, 12000);
}

async function load(){
  const r = await fetch("/api/data?t=" + TOKEN);
  DATA = await r.json();
  const mks = [...new Set(DATA.map(p => p.marketplace))].sort();
  const cats = [...new Set(DATA.map(p => p.category).filter(Boolean))].sort();
  el("mk").innerHTML = '<option value="">Alle marketplaces</option>' +
    mks.map(m => "<option>" + esc(m) + "</option>").join("");
  el("cat").innerHTML = '<option value="">Alle categorieen</option>' +
    cats.map(c => "<option>" + esc(c) + "</option>").join("");
  render();
}

function stats(extra){
  const has = DATA.filter(p => p.installed).length;
  el("stats").innerHTML = "<b>" + DATA.length + "</b> plugins &middot; <b>" + has +
    "</b> geinstalleerd &middot; <b>" + new Set(DATA.map(p => p.marketplace)).size +
    "</b> marketplaces" + (extra ? " &middot; " + extra : "");
}

function render(){
  if(mode === "gh") return renderGh();
  const q = el("q").value.toLowerCase().trim();
  const mk = el("mk").value, cat = el("cat").value;
  const list = DATA.filter(p =>
    (!q || (p.name + " " + p.description + " " + (p.description_en || "") + " " +
            (p.category || "")).toLowerCase().includes(q)) &&
    (!mk || p.marketplace === mk) &&
    (!cat || p.category === cat) &&
    (filter === "all" || (filter === "has") === p.installed));
  stats("zichtbaar: <b>" + list.length + "</b>");
  el("empty").textContent = "Niets gevonden in je catalogus. Probeer het tabblad 'Zoek op GitHub'.";
  el("empty").style.display = list.length ? "none" : "block";
  el("grid").innerHTML = list.map(card).join("");
}

function card(p){
  const id = slug(p.key);
  return '<div class="card' + (p.installed ? " has" : "") + '" id="c_' + id + '">' +
    '<div class="nm">' + (p.installed ? '<span class="dot">&#9679;</span>' : "") + esc(p.name) + "</div>" +
    '<div class="meta"><span class="tag mk">' + esc(p.marketplace) + "</span>" +
      (p.category ? '<span class="tag">' + esc(p.category) + "</span>" : "") +
      (p.installed && !p.enabled ? '<span class="tag off">uitgeschakeld</span>' : "") +
    "</div>" +
    '<div class="desc" title="' + esc(p.description_en || "") + '">' +
      esc(p.description || "(geen omschrijving)") + "</div>" +
    '<div class="row">' +
      (p.installed
        ? '<span class="note ok">&#10003; al geinstalleerd</span>'
        : '<button class="go" data-install="' + esc(p.key) + '">Installeren</button>') +
      (p.url ? '<a class="btn" href="' + esc(p.url) + '" target="_blank" rel="noopener">GitHub &#8599;</a>' : "") +
      '<button class="ghost" title="Kopieer install-commando" data-copy="' + esc(p.key) + '">&#128203;</button>' +
    "</div>" +
    '<div class="note" id="n_' + id + '"></div></div>';
}

function renderGh(){
  stats("GitHub-resultaten: <b>" + GH.length + "</b>");
  el("empty").textContent = "Typ een zoekwoord en klik op 'Zoeken op GitHub'.";
  el("empty").style.display = GH.length ? "none" : "block";
  el("grid").innerHTML = GH.map(repoCard).join("");
}

function repoCard(r){
  const id = slug(r.repo);
  return '<div class="card' + (r.added ? " has" : "") + '" id="r_' + id + '">' +
    '<div class="nm">' + (r.added ? '<span class="dot">&#9679;</span>' : "") + esc(r.repo) + "</div>" +
    '<div class="meta"><span class="tag star">&#9733; ' + r.stars + "</span>" +
      '<span class="tag">marketplace-repo</span></div>' +
    '<div class="desc" title="' + esc(r.description_en || "") + '">' +
      esc(r.description || "(geen omschrijving op GitHub)") + "</div>" +
    '<div class="row">' +
      (r.added
        ? '<span class="note ok">&#10003; al toegevoegd</span>'
        : '<button class="go" data-add="' + esc(r.repo) + '">Toevoegen aan hub</button>') +
      '<a class="btn" href="' + esc(r.url) + '" target="_blank" rel="noopener">GitHub &#8599;</a>' +
    "</div>" +
    '<div class="note" id="rn_' + id + '"></div></div>';
}

async function ghSearch(){
  const q = el("q").value.trim();
  if(!q) return;
  el("grid").innerHTML = "";
  el("empty").textContent = "Zoeken op GitHub...";
  el("empty").style.display = "block";
  let d;
  try{
    d = await (await fetch("/api/search?t=" + TOKEN + "&q=" + encodeURIComponent(q))).json();
  } catch(e){
    el("empty").textContent = "Server niet bereikbaar.";
    return;
  }
  if(d.error){
    el("empty").textContent = d.error;
    GH = [];
    return;
  }
  GH = d.repos || [];
  renderGh();
}

async function install(btn, key){
  const note = el("n_" + slug(key));
  btn.disabled = true;
  btn.textContent = "Bezig...";
  note.className = "note";
  note.textContent = "downloaden en installeren...";
  let d;
  try{
    d = await (await fetch("/api/install?t=" + TOKEN, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: key})
    })).json();
  } catch(e){
    note.className = "note err";
    note.textContent = "server niet bereikbaar - draait 'hub.py web' nog?";
    btn.disabled = false; btn.textContent = "Opnieuw";
    return;
  }
  if(d.ok){
    const p = DATA.find(x => x.key === key);
    if(p){ p.installed = true; p.enabled = true; }
    log("<b>" + esc(key) + "</b> geinstalleerd.\nHerstart Claude Code om hem te laden.");
    render();
  } else {
    note.className = "note err";
    note.textContent = (d.error || "mislukt").split("\n")[0].slice(0, 160);
    btn.disabled = false; btn.textContent = "Opnieuw";
    log("<b>" + esc(key) + "</b> mislukt:\n" + esc(d.error || ""));
  }
}

async function addRepo(btn, repo){
  const note = el("rn_" + slug(repo));
  btn.disabled = true;
  btn.textContent = "Bezig...";
  note.className = "note";
  note.textContent = "repo ophalen...";
  let d;
  try{
    d = await (await fetch("/api/addrepo?t=" + TOKEN, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({repo: repo})
    })).json();
  } catch(e){
    note.className = "note err";
    note.textContent = "server niet bereikbaar";
    btn.disabled = false; btn.textContent = "Opnieuw";
    return;
  }
  if(d.ok){
    const r = GH.find(x => x.repo === repo);
    if(r) r.added = true;
    log("<b>" + esc(repo) + "</b> toegevoegd: <b>" + d.added +
        "</b> plugins erbij.\nStaan nu in 'Mijn catalogus'.");
    await load();
    renderGh();
  } else {
    note.className = "note err";
    note.textContent = (d.error || "mislukt").split("\n")[0].slice(0, 160);
    btn.disabled = false; btn.textContent = "Opnieuw";
    log("<b>" + esc(repo) + "</b> mislukt:\n" + esc(d.error || ""));
  }
}

function setMode(m){
  mode = m;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.mode === m));
  document.querySelectorAll(".localonly").forEach(e => e.classList.toggle("hide", m !== "local"));
  document.querySelectorAll(".ghonly").forEach(e => e.classList.toggle("hide", m === "local"));
  el("q").placeholder = m === "local"
    ? "Zoek op naam, omschrijving of categorie..."
    : "Zoekwoord, dan Enter - zoekt GitHub-repos met een Claude Code marketplace";
  render();
}

document.addEventListener("click", ev => {
  const i = ev.target.closest("[data-install]");
  if(i) return install(i, i.dataset.install);
  const a = ev.target.closest("[data-add]");
  if(a) return addRepo(a, a.dataset.add);
  const c = ev.target.closest("[data-copy]");
  if(c){
    navigator.clipboard.writeText("claude plugin install " + c.dataset.copy);
    return log("Gekopieerd: <b>claude plugin install " + esc(c.dataset.copy) + "</b>");
  }
  const t = ev.target.closest(".tab");
  if(t) return setMode(t.dataset.mode);
  const chip = ev.target.closest(".chip");
  if(chip){
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    chip.classList.add("on");
    filter = chip.dataset.f;
    render();
  }
});
el("ghgo").addEventListener("click", ghSearch);
el("q").addEventListener("input", () => { if(mode === "local") render(); });
el("q").addEventListener("keydown", e => { if(e.key === "Enter" && mode === "gh") ghSearch(); });
el("mk").addEventListener("change", render);
el("cat").addEventListener("change", render);
load();
</script>
</body>
</html>
